name: Release

# Merging a pull request that bumps the version (feat:, fix:, a breaking change;
# see CONTRIBUTING.md) makes release-please open or update a release pull
# request, which changes CHANGELOG.md and .github/release-please-manifest.json.
# Merging that tags v<version> and creates the GitHub release; the jobs below
# then build, test and publish it to PyPI. The version of the package comes
# from the tag. Nothing is published from a laptop.
#
# Run by hand (Run workflow on main, with the tag) to publish a tag again after
# a failure outside the tagged code, such as the PyPI settings. If the tagged
# code is at fault, release a new version instead.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.2.3
        required: true

permissions: {}

# One release at a time, and never cancel one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  # The build tool runs only here, and cannot publish. publish installs and runs
  # nothing from the repository, and publishes only the files build made: their
  # SHA-256 sums are build's outputs, which later jobs cannot change.
  build:
    needs: release-please
    if: >-
      !cancelled() && needs.release-please.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      sums: ${{ steps.build.outputs.sums }}
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # The version is read from the tag, which needs the history.
          fetch-depth: 0
          persist-credentials: false
      - id: commit
        name: Check the commit
        run: |
          # By hand, only from main's own workflow, and only for a commit on main.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "run it on main, not $GITHUB_REF"; exit 1; }
            git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main"; exit 1; }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check the version against PyPI
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nibs/${TAG#v}/json")
          [[ "$status" == 404 ]] || { echo "${TAG#v} is already on PyPI (HTTP $status)"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - id: build
        run: |
          pip install build
          python -m build --outdir "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          version=${TAG#v}
          [[ -f "nibs-$version-py3-none-any.whl" && -f "nibs-$version.tar.gz" ]] || { ls; echo "the files are not version $version"; exit 1; }
          { echo 'sums<<EOF'; sha256sum ./*; echo EOF; } >> "$GITHUB_OUTPUT"
      # The wheel as it will be published installs, and reports the version.
      - run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          [[ "$("$RUNNER_TEMP/venv/bin/nibs" --version)" == "nibs ${TAG#v}" ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 7

  # Separate from build, so that the test tools never touch what is published.
  test:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install -e . pytest
      - run: pytest -q

  publish:
    needs: [build, test]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI's trusted publisher accepts this environment only.
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      # No checkout: only the files build made are used.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: cd dist && sha256sum --check --strict <<< "$SUMS"
        env:
          SUMS: ${{ needs.build.outputs.sums }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
